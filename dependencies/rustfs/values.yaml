mode:
  standalone:
    enabled: true
  distributed:
    enabled: false

secret:
  rustfs:
    access_key: rustfsadmin
    secret_key: streamx-sandbox

storageclass:
  name: ''
  dataStorageSize: 10Gi
  logStorageSize: 1Gi

ingress:
  enabled: true
  className: cloud-provider-kind
  hosts:
    - host: rustfs.localhost
      paths:
        - path: /
          pathType: Prefix

gatewayApi:
  enabled: false