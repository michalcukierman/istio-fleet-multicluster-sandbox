name: traefik

defaultNamespace: traefik-system

helm:
  repo: https://traefik.github.io/charts
  chart: traefik
  version: 40.2.0
  releaseName: traefik

  values:
    service:
      spec:
        type: LoadBalancer

    ports:
      web:
        port: 8000
        exposedPort: 1400
        expose:
          default: true

      websecure:
        expose:
          default: false

  providers:
    kubernetesIngress:
      enabled: true

    kubernetesCRD:
      enabled: false

    kubernetesGateway:
      enabled: false

    ingressClass:
      enabled: true
      isDefaultClass: true
      name: traefik