apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsar
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: pulsar

  template:
    metadata:
      labels:
        app: pulsar

    spec:
      containers:
        - name: pulsar
          image: apachepulsar/pulsar:4.2.4

          command:
            - /bin/bash
            - -ec

          args:
            - |
              /pulsar/bin/apply-config-from-env.py /pulsar/conf/standalone.conf
              exec /pulsar/bin/pulsar standalone

          env:
            - name: PULSAR_PREFIX_authenticationEnabled
              value: "true"

            - name: PULSAR_PREFIX_authenticationProviders
              value: org.apache.pulsar.broker.authentication.AuthenticationProviderToken

            - name: PULSAR_PREFIX_authorizationEnabled
              value: "true"

            - name: PULSAR_PREFIX_superUserRoles
              value: admin

            - name: PULSAR_PREFIX_tokenPublicKey
              value: file:///pulsar/auth/public.key

            - name: PULSAR_PREFIX_brokerClientAuthenticationPlugin
              value: org.apache.pulsar.client.impl.auth.AuthenticationToken

            - name: PULSAR_PREFIX_brokerClientAuthenticationParameters
              value: file:///pulsar/auth/admin.token

          ports:
            - name: pulsar
              containerPort: 6650

            - name: http
              containerPort: 8080

          readinessProbe:
            tcpSocket:
              port: pulsar
            initialDelaySeconds: 10
            periodSeconds: 5

          volumeMounts:
            - name: data
              mountPath: /pulsar/data
            - name: token-private-key
              mountPath: /pulsar/auth/public.key
              subPath: public.key
              readOnly: true
            - name: token-admin
              mountPath: /pulsar/auth/admin.token
              subPath: token
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: token-private-key
          secret:
            secretName: token-private-key
        - name: token-admin
          secret:
            secretName: token-admin
---
apiVersion: v1
kind: Service
metadata:
  name: pulsar
spec:
  selector:
    app: pulsar

  ports:
    - name: pulsar
      port: 6650
      targetPort: pulsar

    - name: http
      port: 8080
      targetPort: http