name: Release Assets

on:
  release:
    types:
      - published

permissions:
  contents: write

env:
  PACKAGE_DIR: .
  PACKAGE_NAME: streamx-multicluster-sandbox

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Create archives
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          NAME="${PACKAGE_NAME}-${TAG}"

          mkdir -p "dist/stage/${NAME}"

          cp -a "${PACKAGE_DIR}/." "dist/stage/${NAME}/"
          rm -rf "dist/stage/${NAME}/.git"
          rm -rf "dist/stage/${NAME}/dist"

          tar \
            -C dist/stage \
            -czf "dist/${NAME}.tar.gz" \
            "${NAME}"

          (
            cd dist/stage
            zip -qr "../${NAME}.zip" "${NAME}"
          )

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
            "${{ github.event.release.tag_name }}" \
            dist/*.tar.gz \
            dist/*.zip